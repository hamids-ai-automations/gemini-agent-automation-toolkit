[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gemini-agent-toolkit"
version = "0.1.0"
description = "Build reliable Google Gemini agents with validated tools, structured outputs, retries, human approval and execution logging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Hamid", email = "hamid.digitalmarketer@gmail.com" }]
keywords = [
  "gemini",
  "ai-agents",
  "llm",
  "function-calling",
  "tool-calling",
  "structured-output",
  "human-in-the-loop",
  "python",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "google-genai>=1.0.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://marvis.web.app/projects/gemini-agent-automation-toolkit.html"
Repository = "https://github.com/hamids-ai-automations/gemini-agent-automation-toolkit"
Issues = "https://github.com/hamids-ai-automations/gemini-agent-automation-toolkit/issues"
Changelog = "https://github.com/hamids-ai-automations/gemini-agent-automation-toolkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["gemini_agent_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
